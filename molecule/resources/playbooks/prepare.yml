---
# role: chromium
# file: molecule/resources/playbooks/prepare.yml

- name: CHROMIUM | Prepare policy fixtures
  hosts: all
  gather_facts: true
  tasks:
    - name: CHROMIUM | Seed an existing policy directory on Debian
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/chromium/policies/managed
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: ansible_facts.distribution == 'Debian'

    - name: CHROMIUM | Seed outdated and independently managed policies on Debian
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: "/etc/chromium/policies/managed/{{ __chromium_fixture }}.json"
        content: '{"ShowHomeButton": true}'
        owner: root
        group: root
        mode: "0600"
      loop:
        - ansible
        - independent
      loop_control:
        loop_var: __chromium_fixture
        label: "{{ __chromium_fixture }}"
      when: ansible_facts.distribution == 'Debian'
