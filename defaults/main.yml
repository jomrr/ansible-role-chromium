---
# role: chromium
# file: defaults/main.yml

# Mandatory Chromium policies written as a complete JSON object.
chromium_policies:
  # true = enforce a separate process for each site, preventing isolation opt-out.
  SitePerProcess: true
  # true = run the network service in its sandbox.
  NetworkServiceSandboxEnabled: true
  # true = run the audio service in its sandbox.
  AudioSandboxEnabled: true
  # true = try HTTPS upgrades automatically, retaining HTTP fallback.
  HttpsUpgradesEnabled: true
  # true = allow component updates; this does not update the browser package.
  ComponentUpdatesEnabled: true
  # true = show warnings for command-line flags that weaken browser security.
  CommandLineFlagSecurityWarningsEnabled: true
  # false = show the warning when the operating system is unsupported.
  SuppressUnsupportedOSWarning: false
  # false = prevent saving new passwords and passkeys in the built-in manager;
  # previously saved credentials remain usable and are not deleted.
  PasswordManagerEnabled: false
# Under Ansible's default hash_behaviour=replace, a supplied dictionary replaces
# these defaults entirely; {} clears the policies managed by this role.
# Security policy examples, reviewed against Linux Chromium 157.0.8103.78 and
# Google's policy templates 157.0.8103.79. Select settings for the deployment;
# the restrictive sections can disable applications and are not enabled here.
# Older distribution packages require checking each policy's supported versions.
# Build flags, API keys and service availability can limit supported features.
# Numeric choices are specific to each policy; integers are not booleans.
# An omitted policy can behave differently from an explicit 0, false or [].
# List patterns and wildcard support are policy-specific; see the references.
# Verify recognition, level, source and errors in chrome://policy after rollout.
# References for policy names, types, values and benchmark applicability:
# https://chromeenterprise.google/policies/
# https://dl.google.com/dl/edgedl/chrome/policy/policy_templates.zip
# https://www.cisecurity.org/benchmark/google_chrome
# https://dl.dod.cyber.mil/wp-content/uploads/stigs/zip/U_Google_Chrome_V2R11_STIG.zip
# These examples cover browser controls relevant to CIS, STIG, privacy and
# restricted-workstation profiles. Benchmark conformance needs a separate review
# of the selected benchmark/version, OS controls, browser build and exceptions.
# Deprecated policies such as SafeBrowsingEnabled, SSLVersionMin,
# SafeBrowsingExtendedReportingEnabled and ExtensionManifestV2Availability are
# omitted. AutofillSettings replaces deprecated address/payment Autofill controls.
# Cloud-only policies (including GenAiDefaultSettings), licensed enterprise
# connectors/DataControlsRules and Chrome Remote Desktop host policies require
# separate product configuration; local Chromium JSON cannot supply that service.
# OriginKeyedProcessesEnabled accepts recommended policies only, so it is also
# excluded from these mandatory-policy examples.
