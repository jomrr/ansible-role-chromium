---
# role: chromium
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Configure mandatory Chromium policies for all browser users.
    options:
      chromium_policies:
        type: dict
        default:
          SitePerProcess: true
          NetworkServiceSandboxEnabled: true
          AudioSandboxEnabled: true
          HttpsUpgradesEnabled: true
          ComponentUpdatesEnabled: true
          CommandLineFlagSecurityWarningsEnabled: true
          SuppressUnsupportedOSWarning: false
          PasswordManagerEnabled: false
        description:
          - Chromium policy names mapped to their JSON-compatible values.
          - Defaults enforce isolation, sandboxes, HTTPS upgrades, component updates and
            warnings, and disable saving passwords and passkeys.
          - The resolved dictionary replaces ansible.json; with Ansible's default hash_behaviour=replace,
            an empty dictionary clears its policies.
          - Other policy files are preserved.
      chromium_policy_dir:
        type: path
        default: null
        description:
          - Absolute directory in which ansible.json is managed; null selects the platform
            default.
          - Uses /etc/chromium-browser/policies/managed on Ubuntu and /etc/chromium/policies/managed
            on other supported platforms.
